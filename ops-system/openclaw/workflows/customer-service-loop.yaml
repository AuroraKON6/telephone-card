id: "customer-service-loop"
owner: "customer_service_agent"
description: "本地客服 Agent 7x24 接待与轻量自学闭环。"

steps:
  - id: "receive_message"
    type: "event"
    event: "chat.message.received"
  - id: "mask_pii"
    type: "processor"
    action: "mask_phone_idcard_address"
  - id: "retrieve_knowledge"
    type: "tool"
    tool: "local_vector_search"
    inputs:
      query: "{{ masked_message }}"
      sources:
        - "../../../knowledge/customer-service-kb.md"
        - "../../../knowledge/172-product-rules.md"
        - "../../../knowledge/compliance-rules.md"
  - id: "answer"
    type: "llm"
    model: "customer_local_qwen"
    prompt: "结合检索结果回复用户；无法确认时说明需核对后台，不要编造。"
  - id: "confidence_check"
    type: "condition"
    if: "{{ answer.confidence < 0.68 }}"
    then: "handoff"
    else: "send_reply"
  - id: "handoff"
    type: "tool"
    tool: "handoff_queue"
    action: "append_unresolved_question"
  - id: "send_reply"
    type: "output"
    channel: "chat"
  - id: "learn_after_session"
    type: "memory"
    action: "summarize_without_pii"
    target: "../../memory/customer-service-memory.yaml"

non_functional:
  external_network: "disabled"
  max_reply_seconds: 12
  pii_storage: "masked_only"
